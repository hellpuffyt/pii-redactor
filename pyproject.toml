[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-redactor"
version = "0.1.0"
description = "Detect and redact personal data in text, CSV, and log files under configurable, reversible policies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Prabesh Sharma" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pii-redactor = "pii_redactor.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/pii-redactor"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
