name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  smoke:
    name: smoke test (redact synthetic sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Redact the committed synthetic sample (text)
        run: |
          python -m pii_redactor.cli redact examples/sample.txt --format text \
            --policy examples/policy.toml --mapping-file /tmp/sample.mapping.json \
            -o /tmp/sample.redacted.txt
          echo "----- redacted output -----"
          cat /tmp/sample.redacted.txt

      - name: Verify no raw synthetic secrets survived redaction
        run: |
          if grep -q "4111111111111111" /tmp/sample.redacted.txt; then
            echo "Card number leaked into redacted output" >&2
            exit 1
          fi
          if grep -q "james.miller@example.com" /tmp/sample.redacted.txt; then
            echo "Email address leaked into redacted output" >&2
            exit 1
          fi
          if grep -q "DE89370400440532013000" /tmp/sample.redacted.txt; then
            echo "IBAN leaked into redacted output" >&2
            exit 1
          fi
          echo "Smoke test passed: no raw synthetic PII found in redacted output."

      - name: Dry run reports counts without writing output
        run: python -m pii_redactor.cli redact examples/sample.txt --format text --dry-run

      - name: Redact the committed synthetic sample (CSV)
        run: |
          python -m pii_redactor.cli redact examples/sample.csv --format csv \
            --policy examples/policy.toml --mapping-file /tmp/sample.csv.mapping.json \
            -o /tmp/sample.redacted.csv
          cat /tmp/sample.redacted.csv

      - name: Redact the committed synthetic sample (JSONL)
        run: |
          python -m pii_redactor.cli redact examples/sample.jsonl --format jsonl \
            --policy examples/policy.toml --mapping-file /tmp/sample.jsonl.mapping.json \
            -o /tmp/sample.redacted.jsonl
          cat /tmp/sample.redacted.jsonl
